title: "Get in touch!"
permalink: /contact/
layout: single
author_profile: false
---

<style>
.contact-page .page__content {
  max-width: 1200px;
  width: 100%;
}

.contact-page .form-wrapper {
  width: 100%;
  max-width: 1200px;
  margin-top: 30px;
}

.contact-page form {
  width: 100%;
}

.contact-page input,
.contact-page textarea {
  width: 100%;
  box-sizing: border-box;
}
</style>

<div class="contact-page">
  <div class="form-wrapper">
    <form action="https://formsubmit.co/pd758@georgetown.edu" method="POST">
      
      <div style="margin-bottom: 20px;">
        <label for="name" style="display: block; font-weight: bold; margin-bottom: 8px;">Name</label>
        <input type="text" id="name" name="name" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label for="email" style="display: block; font-weight: bold; margin-bottom: 8px;">Email</label>
        <input type="email" id="email" name="email" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label for="subject" style="display: block; font-weight: bold; margin-bottom: 8px;">Subject</label>
        <input type="text" id="subject" name="subject" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px;">
      </div>

      <div style="margin-bottom: 20px;">
        <label for="message" style="display: block; font-weight: bold; margin-bottom: 8px;">Message</label>
        <textarea id="message" name="message" rows="8" required style="padding: 12px; border: 1px solid #ddd; border-radius: 4px; font-size: 14px; font-family: Arial, sans-serif;"></textarea>
      </div>

      <button type="submit" style="background-color: #0092ca; color: white; padding: 14px 32px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.3s ease;">
        Send Message
      </button>
    </form>
  </div>
</div>
