<p>I'd love to hear from you! Please use the form below to send me a message.</p>

<form action="https://formsubmit.co/pd758@georgetown.edu" method="POST" style="max-width: 600px; margin-top: 30px;">
  
  <div style="margin-bottom: 20px;">
    <label for="name" style="display: block; font-weight: bold; margin-bottom: 8px;">Name</label>
    <input type="text" id="name" name="name" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
  </div>

  <div style="margin-bottom: 20px;">
    <label for="email" style="display: block; font-weight: bold; margin-bottom: 8px;">Email</label>
    <input type="email" id="email" name="email" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
  </div>

  <div style="margin-bottom: 20px;">
    <label for="subject" style="display: block; font-weight: bold; margin-bottom: 8px;">Subject</label>
    <input type="text" id="subject" name="subject" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px;">
  </div>

  <div style="margin-bottom: 20px;">
    <label for="message" style="display: block; font-weight: bold; margin-bottom: 8px;">Message</label>
    <textarea id="message" name="message" rows="8" required style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; font-size: 14px; font-family: Arial, sans-serif;"></textarea>
  </div>

  <button type="submit" style="background-color: #0092ca; color: white; padding: 14px 32px; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; transition: background-color 0.3s;">Send Message</button>
  
</form>
