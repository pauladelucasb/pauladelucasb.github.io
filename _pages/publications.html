---
layout: archive
title: "Publications"
permalink: /publications/
author_profile: true
---

{% include base_path %}

<ul class="publications-list">
  {% for post in site.publications reversed %}
    <li>
      {{ post.citation | default: post.title }}
      {% if post.paper_url %}
        — <a href="{{ post.paper_url }}" target="_blank" rel="noopener noreferrer">Full text</a>
      {% endif %}
    </li>
  {% endfor %}
</ul>
